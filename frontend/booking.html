<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Jungle Safari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
        }

        #sidebar {
            background-color: #2c3e50;
            color: #ecf0f1;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            padding: 20px;
            transition: all 0.3s;
        }

        #sidebar.active {
            margin-left: -250px;
        }

        .sidebar-header {
            padding-bottom: 20px;
            border-bottom: 1px solid #34495e;
            text-align: center;
        }

        .sidebar-header h3 {
            color: #fff;
            font-weight: bold;
        }

        #sidebar ul.components {
            padding: 20px 0;
        }

        #sidebar ul li a {
            padding: 10px;
            font-size: 1.1em;
            display: block;
            color: #bdc3c7;
            text-decoration: none;
            transition: all 0.3s;
        }

        #sidebar ul li a:hover {
            color: #fff;
            background: #34495e;
            border-radius: 5px;
        }

        #content {
            width: calc(100% - 250px);
            padding: 20px;
            min-height: 100vh;
            transition: all 0.3s;
            margin-left: 250px;
        }

        #content.active {
            width: 100%;
            margin-left: 0;
        }

        #sidebarCollapse {
            background-color: #2980b9;
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background-color: #34495e;
            color: #fff;
            font-weight: bold;
            border-bottom: none;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #f9f9f9;
        }

        .modal-header {
            background-color: #2980b9;
            color: #fff;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        .btn-primary {
            background-color: #2980b9;
            border-color: #2980b9;
        }

        .btn-success {
            background-color: #27ae60;
            border-color: #27ae60;
        }

        .btn-danger {
            background-color: #c0392b;
            border-color: #c0392b;
        }
    </style>
</head>
<body>
    <div class="wrapper d-flex">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-crown"></i> Admin Panel</h3>
            </div>
            <ul class="list-unstyled components">
                <li><a href="#dashboard" data-section="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="#bookings" data-section="bookings"><i class="fas fa-book"></i> Bookings</a></li>
                <li><a href="#safaris" data-section="safaris"><i class="fas fa-car"></i> Safaris</a></li>
                <li><a href="#users" data-section="users"><i class="fas fa-users"></i> Users</a></li>
                <li><a href="#"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 rounded-3 shadow-sm">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-info me-3">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="navbar-brand mb-0 h1">Jungle Safari Management</span>
                </div>
            </nav>

            <div id="dashboard" class="content-section">
                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card text-white bg-primary">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-ticket-alt fa-3x me-3"></i>
                                    <div>
                                        <h5 class="card-title">Total Bookings</h5>
                                        <h1 class="card-text" id="totalBookings">0</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-success">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-car-side fa-3x me-3"></i>
                                    <div>
                                        <h5 class="card-title">Total Safaris</h5>
                                        <h1 class="card-text" id="totalSafaris">0</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-warning">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <i class="fas fa-users fa-3x me-3"></i>
                                    <div>
                                        <h5 class="card-title">Total Users</h5>
                                        <h1 class="card-text" id="totalUsers">0</h1>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="bookings" class="content-section" style="display: none;">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h4 class="mb-0">Manage Bookings</h4>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>User</th>
                                        <th>Safari</th>
                                        <th>Date</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="bookingsTableBody">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div id="safaris" class="content-section" style="display: none;">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">Manage Safaris</h4>
                        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addSafariModal"><i class="fas fa-plus-circle"></i> Add New Safari</button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Image</th>
                                        <th>Name</th>
                                        <th>Description</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="safarisTableBody">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="addSafariModal" tabindex="-1" aria-labelledby="addSafariModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="addSafariModalLabel">Add New Safari</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form id="safariForm" method="POST" enctype="multipart/form-data">
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label for="safariName" class="form-label">Safari Name</label>
                                    <input type="text" class="form-control" id="safariName" name="safariName" required>
                                </div>
                                <div class="mb-3">
                                    <label for="safariDescription" class="form-label">Description</label>
                                    <textarea class="form-control" id="safariDescription" name="safariDescription" rows="3" required></textarea>
                                </div>
                                <div class="mb-3">
                                    <label for="safariImage" class="form-label">Image</label>
                                    <input type="file" class="form-control" id="safariImage" name="safariImage">
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                <button type="submit" class="btn btn-primary">Save Safari</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#sidebarCollapse').on('click', function () {
                $('#sidebar').toggleClass('active');
                $('#content').toggleClass('active');
            });

            // Handle navigation clicks
            $('ul.components li a').on('click', function (e) {
                e.preventDefault();
                $('.content-section').hide();
                const section = $(this).data('section');
                $('#' + section).show();

                // Fetch data based on the section
                if (section === 'bookings') {
                    fetchBookings();
                } else if (section === 'safaris') {
                    fetchSafaris();
                } else if (section === 'dashboard') {
                    fetchDashboardData();
                }
            });

            // Initial data fetch for the dashboard
            fetchDashboardData();

            function fetchDashboardData() {
                $.ajax({
                    url: 'admin2.php', // PHP file to handle requests
                    method: 'GET',
                    data: { action: 'get_dashboard_stats' },
                    success: function(response) {
                        const data = JSON.parse(response);
                        $('#totalBookings').text(data.totalBookings);
                        $('#totalSafaris').text(data.totalSafaris);
                        $('#totalUsers').text(data.totalUsers);
                    }
                });
            }

            function fetchBookings() {
                $.ajax({
                    url: 'admin2.php',
                    method: 'GET',
                    data: { action: 'get_bookings' },
                    success: function(response) {
                        const bookings = JSON.parse(response);
                        let html = '';
                        bookings.forEach(booking => {
                            html += `
                                <tr>
                                    <td>${booking.id}</td>
                                    <td>${booking.user_name}</td>
                                    <td>${booking.safari_name}</td>
                                    <td>${booking.booking_date}</td>
                                    <td>
                                        <button class="btn btn-danger btn-sm" onclick="deleteBooking(${booking.id})"><i class="fas fa-trash"></i> Delete</button>
                                    </td>
                                </tr>
                            `;
                        });
                        $('#bookingsTableBody').html(html);
                    }
                });
            }

            function fetchSafaris() {
                $.ajax({
                    url: 'admin2.php',
                    method: 'GET',
                    data: { action: 'get_safaris' },
                    success: function(response) {
                        const safaris = JSON.parse(response);
                        let html = '';
                        safaris.forEach(safari => {
                            html += `
                                <tr>
                                    <td>${safari.id}</td>
                                    <td><img src="${safari.image_path}" alt="${safari.name}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;"></td>
                                    <td>${safari.name}</td>
                                    <td>${safari.description}</td>
                                    <td>
                                        <button class="btn btn-danger btn-sm" onclick="deleteSafari(${safari.id})"><i class="fas fa-trash"></i> Remove</button>
                                    </td>
                                </tr>
                            `;
                        });
                        $('#safarisTableBody').html(html);
                    }
                });
            }

            // Handle Add Safari Form Submission
            $('#safariForm').on('submit', function(e) {
                e.preventDefault();
                const formData = new FormData(this);
                formData.append('action', 'add_safari');

                $.ajax({
                    url: 'admin2.php',
                    method: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        alert(response);
                        $('#addSafariModal').modal('hide');
                        $('#safariForm')[0].reset();
                        fetchSafaris();
                    }
                });
            });
        });

        function deleteBooking(id) {
            if (confirm('Are you sure you want to delete this booking?')) {
                $.ajax({
                    url: 'admin2.php',
                    method: 'POST',
                    data: { action: 'delete_booking', id: id },
                    success: function(response) {
                        alert(response);
                        location.reload(); // Reload to update table
                    }
                });
            }
        }

        function deleteSafari(id) {
            if (confirm('Are you sure you want to remove this safari?')) {
                $.ajax({
                    url: 'admin2.php',
                    method: 'POST',
                    data: { action: 'delete_safari', id: id },
                    success: function(response) {
                        alert(response);
                        location.reload(); // Reload to update table
                    }
                });
            }
        }
    </script>
</body>
</html>
