<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;  /* keeps aspect ratio and fills nicely */
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="gallery">
    <img src="1.jpg" alt="">
    <img src="2.jpg" alt="">
    <img src="3.jpg" alt="">
    <img src="4.jpg" alt="">
    <img src="5.jpg" alt="">
    <img src="6.jpg" alt="">
    <img src="7.jpg" alt="">
    <img src="8.jpg" alt="">
    <img src="9.jpg" alt="">
    <img src="10.jpg" alt="">
    <img src="11.jpg" alt="">
    <img src="12.jpg" alt="">
    <img src="13.jpg" alt="">
    <img src="14.jpg" alt="">
    <img src="15.jpg" alt="">
    <img src="16.jpg" alt="">
    <img src="17.jpg" alt="">
    <img src="18.jpg" alt="">
    <img src="19.jpg" alt="">
    <img src="20.jpg" alt="">

  </div>
</body>
</html>
